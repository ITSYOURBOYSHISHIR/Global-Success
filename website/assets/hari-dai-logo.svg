<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Hari Dai">
  <defs>
    <linearGradient id="hd-bg" x1="18" y1="12" x2="102" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DC2626"/>
      <stop offset="1" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="hd-skin" x1="40" y1="42" x2="80" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD7B0"/>
      <stop offset="1" stop-color="#E8A875"/>
    </linearGradient>
    <linearGradient id="hd-hair" x1="44" y1="34" x2="76" y2="52" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3F2A1D"/>
      <stop offset="1" stop-color="#2A1810"/>
    </linearGradient>
    <linearGradient id="hd-shirt" x1="30" y1="78" x2="90" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <pattern id="hd-dhaka" width="8" height="6" patternUnits="userSpaceOnUse">
      <rect width="8" height="6" fill="#B91C1C"/>
      <path d="M0 3 L4 0 L8 3 L4 6 Z" fill="#FDE68A"/>
      <path d="M0 0 L4 3 L0 6" fill="#991B1B" opacity="0.45"/>
      <path d="M8 0 L4 3 L8 6" fill="#991B1B" opacity="0.45"/>
    </pattern>
    <filter id="hd-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#450A0A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- App icon base -->
  <rect width="120" height="120" rx="28" fill="url(#hd-bg)"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="26.5" stroke="#FFFFFF" stroke-opacity="0.16"/>

  <!-- Character group -->
  <g filter="url(#hd-shadow)">
    <!-- Shoulders / kurta -->
    <path d="M24 96 C28 82 40 76 60 76 C80 76 92 82 96 96 L96 104 C96 108 93 111 89 111 L31 111 C27 111 24 108 24 104 Z" fill="url(#hd-shirt)"/>
    <path d="M38 96 L60 86 L82 96" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M31 104 C42 99 52 97 60 97 C68 97 78 99 89 104" stroke="#F1F5F9" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Arms + namaste hands -->
    <path d="M38 78 C34 74 32 68 34 62 C36 56 42 52 48 52" stroke="#E8A875" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M82 78 C86 74 88 68 86 62 C84 56 78 52 72 52" stroke="#E8A875" stroke-width="7" stroke-linecap="round" fill="none"/>
    <ellipse cx="60" cy="58" rx="14" ry="11" fill="url(#hd-skin)"/>
    <path d="M46 58 C46 50 52 44 60 44 C68 44 74 50 74 58 L74 64 C74 68 70 72 66 72 L54 72 C50 72 46 68 46 64 Z" fill="#FFD7B0"/>
    <path d="M49 56 L60 48 L71 56" stroke="#D4956A" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M52 62 L60 57 L68 62" stroke="#D4956A" stroke-width="1.1" stroke-linecap="round" fill="none"/>
    <path d="M55 66 L60 63 L65 66" stroke="#C68642" stroke-width="1" stroke-linecap="round" fill="none"/>

    <!-- Neck -->
    <rect x="54" y="68" width="12" height="10" rx="4" fill="#E8A875"/>

    <!-- Head -->
    <ellipse cx="60" cy="46" rx="24" ry="26" fill="url(#hd-skin)"/>

    <!-- Hair side locks (anime) -->
    <path d="M36 44 C34 52 35 58 38 62 C36 54 36 48 36 44 Z" fill="url(#hd-hair)"/>
    <path d="M84 44 C86 52 85 58 82 62 C84 54 84 48 84 44 Z" fill="url(#hd-hair)"/>

    <!-- Ears -->
    <ellipse cx="37" cy="48" rx="3.2" ry="4.5" fill="#E8A875"/>
    <ellipse cx="83" cy="48" rx="3.2" ry="4.5" fill="#E8A875"/>

    <!-- Anime eyes -->
    <ellipse cx="50" cy="48" rx="5.5" ry="6.5" fill="#FFFFFF"/>
    <ellipse cx="70" cy="48" rx="5.5" ry="6.5" fill="#FFFFFF"/>
    <ellipse cx="50.5" cy="49" rx="3.8" ry="4.8" fill="#2F1810"/>
    <ellipse cx="70.5" cy="49" rx="3.8" ry="4.8" fill="#2F1810"/>
    <circle cx="51.8" cy="47.2" r="1.5" fill="#FFFFFF"/>
    <circle cx="71.8" cy="47.2" r="1.5" fill="#FFFFFF"/>
    <circle cx="49.2" cy="50.5" r="0.7" fill="#FFFFFF" opacity="0.7"/>

    <!-- Eyebrows -->
    <path d="M44 42 Q50 39 56 41" stroke="#5C3D2E" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <path d="M64 41 Q70 39 76 42" stroke="#5C3D2E" stroke-width="1.8" stroke-linecap="round" fill="none"/>

    <!-- Nose + smile -->
    <path d="M60 52 L60 55" stroke="#C68642" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M54 58 Q60 62 66 58" stroke="#B45309" stroke-width="1.8" stroke-linecap="round" fill="none"/>
    <ellipse cx="46" cy="54" rx="3" ry="1.6" fill="#F4A4A4" opacity="0.45"/>
    <ellipse cx="74" cy="54" rx="3" ry="1.6" fill="#F4A4A4" opacity="0.45"/>

    <!-- Dhaka topi -->
    <ellipse cx="60" cy="28" rx="22" ry="5.5" fill="#991B1B"/>
    <path d="M38 28 C38 22 48 18 60 18 C72 18 82 22 82 28 L82 34 C82 36 80 38 78 38 L42 38 C40 38 38 36 38 34 Z" fill="url(#hd-dhaka)"/>
    <path d="M38 28 C38 22 48 18 60 18 C72 18 82 22 82 28 L82 34 C82 36 80 38 78 38 L42 38 C40 38 38 36 38 34 Z" stroke="#7F1D1D" stroke-width="1"/>
    <ellipse cx="60" cy="22" rx="22" ry="5" fill="#DC2626"/>
    <path d="M38 30 H82" stroke="#FEF3C7" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M42 24 H78" stroke="#FEF3C7" stroke-opacity="0.22" stroke-width="0.8"/>
  </g>
</svg>
